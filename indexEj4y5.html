<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://getbootstrap.com/docs/5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./estiloEj4y5.css">
    <script src="./appsEj4y5.js"></script>
    <title>Ejercicio 4 y 5</title>
</head>
<body>
<header class="text-center py-4">
  <h1>Datos del Empleado</h1>
</header>

<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="apellido" class="form-label">Apellido:</label>
        <input type="text" id="apellido" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="dni" class="form-label">DNI:</label>
        <input type="text" id="dni" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="direccion" class="form-label">Dirección:</label>
        <input type="text" id="direccion" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="sueldoxms" class="form-label">Sueldo por mes:</label>
        <input type="number" id="sueldoxms" class="form-control" required/>
      </div>
      <div class="mb-3">
        <label for="suelxhs" class="form-label">Sueldo por hora:</label>
        <input type="number" id="suelxhs" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="precioxhs" class="form-label">Precio por hora:</label>
        <input type="number" id="precioxhs" class="form-control"/>
      </div>

      <button type="button" class="btn btn-primary w-100 mt-2" onclick="mostrarEmpleado()">Mostrar Empleado</button>
      <div id="respuesta" class="mt-4"></div>

    </div>
    <div class="col-md-6 mt-3 d-flex justify-content-center">
      <img src="./imagenes/Ej4y5Empleado.png" alt="#" class="img-fluid rounded-circle shadow-lg"style="width: 450px;height: 500px"/>
    </div>
  </div>
</main>
     <footer class="text-center py-3">
    <p class="text-muted">UTN - Programación 3 -Cedrón Agustina- 2026</p>
  </footer>
</body>
</html>
