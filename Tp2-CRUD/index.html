  <head>

  <body>
    <header>
      <h1>Mi Lista de Tareas</h1>
    </header>
    <main>
      <form onsubmit="return false;">
        <label for="nuevaTarea">Nueva Tarea</label>
        <input type="text" id="nuevaTarea" placeholder="Ingresá tu tarea" />
        <button id="agregarTarea" class="btn btn-outline-violet">
          Agregar
        </button>
      </form>
      <div id="filtros">
    <button class="btnFiltro" onclick="filtrar('todas')">Todas</button>
    <button class="btnFiltro" onclick="filtrar('completadas')">Completadas</button>
    <button class="btnFiltro" onclick="filtrar('pendientes')">Pendientes</button>
</div>
      <div id="lista"></div>
    </main>
    <footer>
      <h4>TP2-COM3-Cedrón Agustina</h4>
    </footer>
  </body>
