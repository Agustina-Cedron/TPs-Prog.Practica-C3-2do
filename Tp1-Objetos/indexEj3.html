<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://getbootstrap.com/docs/5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./estiloEj3.css">
    <script src="./appsEj3.js" defer></script>
    <title>Ejercicio 3</title>
</head>
<body>
    <header class="text-center py-4">
  <h1>Datos del Producto</h1>
</header>

<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <h3 class="mb-4">Ingrese los datos del producto</h3>

      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="precio" class="form-label">Precio:</label>
        <input type="number" id="precio" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción:</label>
        <input type="text" id="descripcion" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="marca" class="form-label">Marca:</label>
        <input type="text" id="marca" class="form-control"/>
      </div>
      <div class="mb-3">
        <label for="descuento" class="form-label">Porcentaje de Descuento:</label>
        <input type="number" id="descuento" class="form-control"/>
      </div>

      <button type="button" class="btn btn-primary w-100 mt-2" onclick="mostrarProducto()">Ver Datos</button>
      <div id="respuesta" class="mt-4"></div>

    </div>
     <div class="col-md-6 mt-5 d-flex justify-content-center align-items-center">
  <img src="./imagenes/Ej3.producto.png" alt="Producto" class="img-fluid rounded-circle shadow-lg"style="width: 350px;height: 520px"/>
</div>
  </div>
</main>
     <footer class="text-center py-3">
    <p class="text-muted">UTN - Programación 3 -Cedrón Agustina- 2026</p>
  </footer>
</body>
</html>
